<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AC/DC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // CDN 스크립트가 먼저 로드된 뒤에 설정해야 적용된다.
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Pretendard Variable"', 'Pretendard', 'system-ui', 'sans-serif']
            },
            colors: {
              /* 디자인 토큰(값은 src/style.css의 :root 변수) */
              ground: 'var(--ground)',
              surface: 'var(--surface)',
              rail: 'var(--rail)',
              ink: 'var(--ink)',
              muted: 'var(--muted)',
              faint: 'var(--faint)',
              line: 'var(--line)',
              rule: 'var(--rule)',
              control: 'var(--control)',
              dash: 'var(--dash)',
              primary: 'var(--primary)',
              primaryHover: 'var(--primary-hover)',
              accent: 'var(--accent)',
              accentTint: 'var(--accent-tint)',
              accentLine: 'var(--accent-line)',
              topbar: 'var(--topbar)',
              positive: 'var(--positive)',
              negative: 'var(--negative)',
              /* 통화·숙지 화면의 어두운 무대 색 */
              stage: 'rgb(var(--stage-rgb) / <alpha-value>)',
              stagePanel: 'var(--stage-panel)',
              stageRaised: 'var(--stage-raised)',
              stageInk: 'var(--stage-ink)',
              stageAlert: 'var(--stage-alert)',
              stageOk: 'var(--stage-ok)',
              stageWarnBg: 'var(--stage-warn-bg)',
              stageWarnFg: 'var(--stage-warn-fg)'
            },
            borderRadius: {
              card: '8px',
              control: '6px',
              chip: '4px'
            }
          }
        }
      };
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
